<div class="container">

  <div class="header">

    <h2>Education</h2>

    <a
      routerLink="/education/add"
      class="add-btn">

      + Add Education

    </a>

  </div>

  <table>

    <thead>

      <tr>

        <th>Degree</th>
        <th>Institution</th>
        <th>Field</th>
        <th>Grade</th>
        <th>Actions</th>

      </tr>

    </thead>

    <tbody>

      <tr *ngFor="let education of educations">

        <td>{{ education.degree }}</td>

        <td>{{ education.institution }}</td>

        <td>{{ education.fieldOfStudy }}</td>

        <td>{{ education.grade }}</td>

        <td>

          <a
            [routerLink]="['/education/edit', education.id]">

            Edit

          </a>

          |

          <button
            type="button"
            (click)="deleteEducation(education.id)">

            Delete

          </button>

        </td>

      </tr>

      <tr *ngIf="educations.length === 0" class="empty-row">
  <td colspan="5">
    No education records found.
  </td>
</tr>

      

    </tbody>

  </table>

</div>
